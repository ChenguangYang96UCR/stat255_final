seed: 42
data:
  image_dir: data/ISIC_2019_Training_Input
  metadata_csv: data/ISIC_2019_Training_Metadata.csv
  ground_truth_csv: data/ISIC_2019_Training_GroundTruth.csv
  split_csv: data/splits.csv
  image_size: 224
  num_workers: 4
  batch_size: 32
  metadata_features: [age_approx, sex, anatom_site_general]
model:
  type: multimodal       # metadata_linear, metadata_mlp, image, multimodal
  fusion: concat         # concat, gated, decision, attention
  pretrained: true
  image_dim: 256
  metadata_dim: 128
  projection_dim: 128
  dropout: 0.30
  attention_heads: 4
  decision_alpha: 0.8
training:
  epochs: 20
  freeze_backbone_epochs: 2
  learning_rate: 0.0003
  backbone_learning_rate: 0.00003
  weight_decay: 0.0001
  loss: weighted_ce      # ce, weighted_ce, focal
  focal_gamma: 2.0
  alignment_weight: 0.0
  alignment_temperature: 0.1
  early_stopping_patience: 5
  amp: true
output_dir: outputs/concat

